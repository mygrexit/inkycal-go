name: release

# Pushing a tag vX.Y.Z (on a commit of main) builds and publishes the stable release that
# install.sh installs (releases/latest). The release notes are the tag's message.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: tag must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: make check (vet, tests, staticcheck, govulncheck, UI tests)
        run: make check

      - name: build (make release)
        run: make release

      - name: show Go version in the binaries
        run: go version -m dist/inkycal-linux-arm64 | head -1

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/inkycal-linux-arm64 dist/inkycal-linux-armv7 dist/inkycal-linux-armv6 dist/SHA256SUMS \
            --verify-tag --notes-from-tag --title "$GITHUB_REF_NAME"
