name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: make check (vet, tests, staticcheck, govulncheck, UI tests)
        run: make check

      - name: race detector
        run: go test -race ./...

      - name: benchmarks still run
        run: go test -run '^$' -bench . -benchtime 1x ./...

      - name: release builds (arm64, armv7, armv6)
        run: make release
